name: Lintint, Typing, and Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy pylint pytest pytest-cov
      - name: Lint with pylint
        run: |
          pylint essential_building_blocks/ --output=lint.txt || true
      - name: Typecheck with mypy
        run: |
          mypy essential_building_blocks/
      - name: Test with pytest
        run: |
          pytest tests/ --cov=essential_building_blocks/
